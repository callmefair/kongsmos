baseURL = 'https://callmefair.github.io/kongsmos/'
languageCode = 'en-us'
title = 'Kongsmos Theory'
theme = 'PaperMod'

[params]
    math = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardLineBreak = true
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]